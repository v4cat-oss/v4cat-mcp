[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v4cat-mcp"
version = "0.5.0"
description = "MCP server for v4cat — exposes the symmetry-break catalogue ISA as Model Context Protocol tools, resources, and prompts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mike Mol", email = "mikemol@gmail.com" },
]
keywords = [
    "knowledge-graph",
    "mcp",
    "model-context-protocol",
    "structural-cataloguing",
    "v4cat",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "v4cat>=0.5",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage    = "https://github.com/v4cat-oss/v4cat-mcp"
Source      = "https://github.com/v4cat-oss/v4cat-mcp"
Issues      = "https://github.com/v4cat-oss/v4cat-mcp/issues"
Core        = "https://github.com/v4cat-oss/v4cat"

[project.scripts]
v4cat-mcp = "v4cat_mcp.server:main"

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/v4cat_mcp/tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
v4cat_mcp = ["*.md"]
